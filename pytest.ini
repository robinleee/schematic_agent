[pytest]
testpaths = hardware_ai_expert/tests
addopts = -m "not llm and not live"
markers =
    unit: pure offline unit tests
    integration: offline component-level integration tests
    e2e: isolated API product paths with fake stores
    live: requires authorized external services and isolated test project; never CI default
    llm: requires a running Ollama/Neo4j stack; never CI default
    timeout(seconds): timeout provided by pytest-timeout
